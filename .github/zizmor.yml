#
# Actions maintained by GitHub (actions/* and github/*) are referenced by
# version tag, so that a reviewer reads the version and Dependabot tracks
# it. Every other action is pinned to a full commit hash.
rules:
  unpinned-uses:
    config:
      policies:
        "actions/*": ref-pin
        "github/*": ref-pin
        "*": hash-pin
